---
- name: Bootstrap ansible user on VMs (bypass Ansible become, uses direct SSH)
  hosts: vm
  gather_facts: false
  vars:
    ansible_become: false

  tasks:
    - name: Run bootstrap script to create ansible user + key + NOPASSWD sudo
      delegate_to: localhost
      ansible.builtin.shell: |
        bash /home/g3n1k/workspace/ansible/bootstrap-remote.sh \
         {{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }} \
         {{ ansible_become_password }} \
         {{ bootstrap_user | default('ub') }}
         
      args:
        executable: /bin/bash
      register: result
      changed_when: result.rc == 0

    - name: Show bootstrap result
      delegate_to: localhost
      ansible.builtin.debug:
        var: result.stdout_lines
