---
- name: Install Visual Studio Code
  hosts: all
  become: true

  tasks:
    - name: Detect OS
      ansible.builtin.debug:
        msg: "Installing VSCode on {{ ansible_distribution }}"

    # === Ubuntu / Debian ===
    - name: Install prerequisites (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - wget
          - gpg
          - apt-transport-https
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Import Microsoft GPG key (Debian/Ubuntu)
      ansible.builtin.shell: |
        wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg
      args:
        creates: /usr/share/keyrings/microsoft.gpg
      when: ansible_os_family == "Debian"

    - name: Add VSCode repository (Debian/Ubuntu)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/vscode.list
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main
      when: ansible_os_family == "Debian"

    - name: Install VSCode (Debian/Ubuntu)
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # === Rocky / CentOS ===
    - name: Import Microsoft GPG key (Rocky/CentOS)
      ansible.builtin.rpm_key:
        state: present
        key: https://packages.microsoft.com/keys/microsoft.asc
      when: ansible_os_family == "RedHat"

    - name: Add VSCode repository (Rocky/CentOS)
      ansible.builtin.yum_repository:
        name: vscode
        description: Visual Studio Code
        baseurl: https://packages.microsoft.com/yumrepos/vscode
        gpgcheck: yes
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Install VSCode (Rocky/CentOS)
      ansible.builtin.yum:
        name: code
        state: present
      when: ansible_os_family == "RedHat"

    # === Verification (run as non-root) ===
    - name: Check VSCode version (run as current user)
      become: false
      ansible.builtin.command: code --version
      register: vscode_version
      changed_when: false
      ignore_errors: true

    - name: Display installed VSCode version
      ansible.builtin.debug:
        msg: "{{ vscode_version.stdout_lines | default(['VSCode installed successfully']) }}"
