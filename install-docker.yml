---
- name: Install Docker Engine and Docker Compose
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies for Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker’s official GPG key
      ansible.builtin.command:
        cmd: >
          bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
          sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg"
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Set up the Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable
      notify: Update apt cache

    - name: Install Docker Engine, CLI, containerd, and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group (agar tidak perlu sudo)
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

  handlers:
    - name: Update apt cache
      apt:
        update_cache: yes
