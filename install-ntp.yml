---
- name: Install dan setup NTP
  hosts: all
  become: true

  tasks:
    - name: Install NTP package (chrony)
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Enable and start chrony service
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started

    - name: Wait for initial NTP sync
      ansible.builtin.command: chronyc makestep
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Check chrony status
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Display chrony status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout }}"
      when: ansible_os_family == "Debian"
