---
- name: Install and configure Cloudflared service
  hosts: all
  become: true
  tasks:
    - name: Show detected OS
      ansible.builtin.debug:
        msg: "Detected OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Add Cloudflare GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
      args:
        creates: /usr/share/keyrings/cloudflare-main.gpg
      when: ansible_os_family == "Debian"

    - name: Add Cloudflare repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/cloudflare-client.list
        content: |
          deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main
      when: ansible_os_family == "Debian"

    - name: Ensure dependencies are installed
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - gnupg
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Update apt cache and install Cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Verify Cloudflared installation
      ansible.builtin.command: cloudflared --version
      register: cloudflared_version
      changed_when: false

    - name: Display installed Cloudflared version
      ansible.builtin.debug:
        msg: "{{ cloudflared_version.stdout }}"

    - name: Create default Cloudflared config directory
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create default Cloudflared config file
      ansible.builtin.copy:
        dest: /etc/cloudflared/config.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          # Cloudflared default configuration
          tunnel: no-tunnel
          logfile: /var/log/cloudflared.log
          loglevel: info
          metrics: 127.0.0.1:49312
          no-autoupdate: true
          # Contoh: jika ingin forward port lokal ke publik Cloudflare Tunnel
          # ingress:
          #   - hostname: example.mytunnel.com
          #     service: http://localhost:8000
          #   - service: http_status:404

    - name: Register cloudflared as a systemd service
      ansible.builtin.command: cloudflared service install
      args:
        creates: /etc/systemd/system/cloudflared.service
      register: service_install
      changed_when: "'Created' in service_install.stdout or 'created' in service_install.stdout"

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Cloudflared service
      ansible.builtin.systemd:
        name: cloudflared
        enabled: true
        state: started

    - name: Check Cloudflared service status
      ansible.builtin.command: systemctl is-active cloudflared
      register: service_status
      changed_when: false

    - name: Display Cloudflared service status
      ansible.builtin.debug:
        msg: "Cloudflared service is {{ service_status.stdout }}"
